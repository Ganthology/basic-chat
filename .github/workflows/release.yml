name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version
        id: bump
        run: |
          version="$(node scripts/bump-app-version.js "${{ inputs.bump }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(repo): bump version to ${version}"
          git tag "v${version}"
          git push origin HEAD
          git push origin "v${version}"
          gh release create "v${version}" --generate-notes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm ci

      - name: Prebuild Android
        run: |
          cp .env.example .env
          npx expo prebuild --platform android --non-interactive

      - name: Assemble release APKs
        run: npm run android:release:all

      - name: Upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.bump.outputs.version }}" dist/apk/*.apk
